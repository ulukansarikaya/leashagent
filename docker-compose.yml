# Public demo on a VPS: docs/DEPLOY.md
services:
  gateway:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      LEASH_DATA_DIR: /data
    volumes:
      - leash-data:/data
    restart: unless-stopped
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    depends_on:
      - gateway
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Domain pointing at this server (automatic HTTPS), or ":80" for plain HTTP on the IP.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  leash-data:
  caddy-data:
  caddy-config:
